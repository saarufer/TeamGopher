[project]
name = "gopher-agents"
version = "0.1.0"
description = "地鼠团队：可审计的多 Agent 投资决策系统（仅模拟交易）"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
llm = ["anthropic>=0.70"]
data = ["yfinance>=0.2.40"]

[project.scripts]
gopher = "gopher.cli:main"

[dependency-groups]
dev = ["pytest>=8", "hypothesis>=6"]

[build-system]
requires = ["uv_build>=0.11.23,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "gopher"

[tool.pytest.ini_options]
testpaths = ["tests"]
